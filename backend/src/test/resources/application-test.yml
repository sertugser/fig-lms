spring:
  datasource:
    url: jdbc:h2:mem:fig;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      # Flyway creates the schema (src/main/resources/db/migration), as in production.
      ddl-auto: validate

fig:
  sample-users:
    password: test-password
  files:
    # Outside the project, so tests never touch real uploads.
    root: ${java.io.tmpdir}/fig-lms-test-files
